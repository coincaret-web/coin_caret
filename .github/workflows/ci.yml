name: Coin Caret CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality & Testing Pipeline
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coin_caret_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5433/coin_caret_test?schema=public"
      NEXTAUTH_SECRET: "coin-caret-test-secret-key-32-chars-minimum-length-test"
      NEXTAUTH_URL: "http://127.0.0.1:4190"
      PORT: "4190"
      NODE_ENV: "test"
      HOST: "127.0.0.1"
      BLOCK_INTERVAL_MS: "1000"
      STANDARD_FEE_CC: "0.50"
      REQUIRED_CONFIRMATIONS: "1"

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "3. Install Dependencies"
        run: npm ci

      - name: "4. Setup Test Environment File"
        run: cp .env.test.example .env.test

      - name: "5. Discrete Step: Lint Codebase"
        run: npm run lint

      - name: "6. Discrete Step: TypeScript Typecheck"
        run: npm run typecheck

      - name: "7. Setup Test Database Schema"
        run: npx prisma migrate deploy || echo "No migrations yet"

      - name: "8. Discrete Step: Unit Tests"
        run: npm run test:unit

      - name: "9. Discrete Step: Integration Tests"
        run: npm run test:integration

      - name: "10. Discrete Step: Production Build"
        env:
          NEXTAUTH_URL: "http://127.0.0.1:3847"
        run: npm run build
